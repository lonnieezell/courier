site_name: Courier
site_description: Email marketing for CodeIgniter 4 — contacts, campaigns, drip sequences, and tracking.

# Agent-facing notes live under docs/ for editing convenience, but they are not
# part of the published site. MkDocs builds every page it finds regardless of
# nav, so without this they would be reachable by URL after gh-deploy.
exclude_docs: |
  agents/
  review/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - content.code.copy
    - navigation.footer
    - content.action.edit
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share

repo_url: https://github.com/lonnieezell/courier
edit_uri: edit/develop/docs/
copyright: Copyright &copy; 2026 Lonnie Ezell.

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables

plugins:
  - search

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Contacts: contacts.md
  - Signup Forms: signup-forms.md
  - Campaigns: campaigns.md
  - Drip Sequences: drip-sequences.md
  - File-Based Campaigns: file-based-campaigns.md
  - Email Templates: templates.md
  - Mailables: mailables.md
  - CLI Commands: commands.md
  - Management Commands: management-commands.md
  - Tracking: tracking.md
  - Events: events.md
